services:
  db:
    image: postgres:17-alpine
    container_name: store-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/test/resources/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/store
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - store-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: store-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - store-network

volumes:
  pgdata:

networks:
  store-network:
    driver: bridge